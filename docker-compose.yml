services:
  app:
    build: ./docker/php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    dns:
      - 8.8.8.8
      - 8.8.4.4

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    dns:
      - 8.8.8.8
      - 8.8.4.4

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: facturacion
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  dbdata: